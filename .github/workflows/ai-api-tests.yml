name: AI API smoke tests
on:
  push:
    branches: [feature/ai-analysis-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Node and run isolated mock tests
        run: |
          node --version
          npm test
